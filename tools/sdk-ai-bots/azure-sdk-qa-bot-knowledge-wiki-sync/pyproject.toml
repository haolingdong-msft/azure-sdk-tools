[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "azure-sdk-qa-bot-knowledge-wiki-sync"
version = "1.0.0"
description = "Wiki-tree knowledge index builder for Azure SDK QA Bot — a lightweight PageIndex-tree + WeKnora-wiki alternative to the GraphRAG entity-graph build"
requires-python = ">=3.11,<3.14"
dependencies = [
    "azure-identity>=1.20.0",
    "azure-storage-blob>=12.20.0",
    "numpy>=1.26",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.40.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
sync-knowledge-wiki = "azure_sdk_qa_bot_knowledge_wiki_sync.main:main"

[tool.hatch.build.targets.wheel]
packages = ["azure_sdk_qa_bot_knowledge_wiki_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
